<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convergence trace</title>
  <style>
    body { margin: 0; background: #f2f5f8; color: #1f3043; font: 16px system-ui, sans-serif; }
    main { max-width: 1050px; margin: 24px auto; padding: 0 16px; }
    h1 { margin: 0 0 12px; font-size: 1.4rem; }
    .viewer { background: white; border: 1px solid #cdd7e1; border-radius: 8px; overflow: hidden; }
    img { display: block; width: 100%; height: auto; }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
                padding: 12px; border-top: 1px solid #cdd7e1; }
    .transport, .scrub, .speed { display: flex; align-items: center; gap: 8px; }
    .scrub { flex: 1 1 230px; }
    .scrub input { flex: 1; min-width: 65px; accent-color: #284869; }
    button, select { font: inherit; color: inherit; background: white; border: 1px solid #a8b8c8;
                     border-radius: 5px; min-height: 36px; padding: 4px 9px; }
    button:enabled, select, input { cursor: pointer; }
    button:disabled { opacity: 0.48; }
    #play { color: white; background: #284869; border-color: #284869; min-width: 68px; }
    #frame-count { min-width: 6ch; text-align: right; font-variant-numeric: tabular-nums; }
    .hint { color: #43586f; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Convergence trace</h1>
    <div class="viewer">
      <img id="plot" alt="Sensor positions and official objective history">
      <div class="controls">
        <div class="transport">
          <button type="button" id="previous">Previous</button>
          <button type="button" id="play">Play</button>
          <button type="button" id="next">Next</button>
        </div>
        <div class="scrub">
          <label for="frame">Frame</label>
          <input id="frame" type="range" min="1" step="1" value="1">
          <span id="frame-count"></span>
        </div>
        <div class="speed">
          <label for="speed">Speed</label>
          <select id="speed">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
        </div>
      </div>
    </div>
    <p class="hint">Use the left and right arrow keys to step through frames.</p>
    <noscript>Enable JavaScript in your browser to use the embedded frame controls.</noscript>
  </main>
  <script id="viewer-data" type="application/json">__VIEWER_DATA__</script>
  <script>
    const {frames, frameMs, finalFrameMs} = JSON.parse(document.getElementById("viewer-data").textContent);
    const plot = document.getElementById("plot");
    const previous = document.getElementById("previous");
    const play = document.getElementById("play");
    const next = document.getElementById("next");
    const slider = document.getElementById("frame");
    const count = document.getElementById("frame-count");
    const speed = document.getElementById("speed");
    const last = frames.length - 1;
    let current = 0;
    let playing = false;
    let timer;

    function showFrame(index) {
      current = Math.max(0, Math.min(index, last));
      plot.src = "data:image/png;base64," + frames[current];
      slider.value = current + 1;
      slider.setAttribute("aria-valuetext", `${current + 1} of ${frames.length}`);
      count.textContent = `${current + 1} / ${frames.length}`;
      previous.disabled = current === 0;
      next.disabled = current === last;
    }

    function schedule() {
      window.clearTimeout(timer);
      if (!playing) return;
      const delay = current === last ? finalFrameMs : frameMs;
      timer = window.setTimeout(() => seek((current + 1) % frames.length), delay / Number(speed.value));
    }

    function seek(index) {
      showFrame(index);
      schedule();
    }

    slider.max = frames.length;
    slider.disabled = last === 0;
    play.disabled = last === 0;
    showFrame(0);
    previous.addEventListener("click", () => seek(current - 1));
    next.addEventListener("click", () => seek(current + 1));
    play.addEventListener("click", () => {
      playing = !playing;
      play.textContent = playing ? "Pause" : "Play";
      schedule();
    });
    slider.addEventListener("input", () => seek(Number(slider.value) - 1));
    speed.addEventListener("change", schedule);
    document.addEventListener("keydown", (event) => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.target === speed) return;
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      seek(current + (event.key === "ArrowLeft" ? -1 : 1));
    });
  </script>
</body>
</html>
